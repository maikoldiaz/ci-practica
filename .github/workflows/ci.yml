name: CI

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - run: python -m pip install -r requirements.txt

      - name: Ejecutar pruebas y guardar la salida
        run: python -m pytest -v | tee salida_pytest.txt
